  <circle cx="48" cy="33" r="4.5" fill="#ff5f57"/>
  <circle cx="64" cy="33" r="4.5" fill="#febc2e"/>
  <circle cx="80" cy="33" r="4.5" fill="#28c840"/>
  <rect x="210" y="25" width="220" height="16" rx="8" fill="#26262e"/>
