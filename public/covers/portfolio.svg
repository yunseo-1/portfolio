  <circle cx="376" cy="136" r="3" fill="#ff5f57"/>
  <circle cx="388" cy="136" r="3" fill="#febc2e"/>
  <circle cx="400" cy="136" r="3" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="376" y="168"><tspan fill="#c792ea">const</tspan><tspan fill="#82aaff"> dev</tspan><tspan fill="#89ddff"> = </tspan><tspan fill="#cfcfd6">{</tspan></text>
    <text x="392" y="187"><tspan fill="#f07178">name</tspan><tspan fill="#cfcfd6">: </tspan><tspan fill="#c3e88d">'김윤서'</tspan><tspan fill="#cfcfd6">,</tspan></text>
    <text x="392" y="206"><tspan fill="#f07178">stack</tspan><tspan fill="#cfcfd6">: [</tspan><tspan fill="#c3e88d">'React'</tspan><tspan fill="#cfcfd6">, </tspan><tspan fill="#c3e88d">'TS'</tspan><tspan fill="#cfcfd6">],</tspan></text>
    <text x="392" y="225"><tspan fill="#f07178">focus</tspan><tspan fill="#cfcfd6">: </tspan><tspan fill="#c3e88d">'UX 디테일'</tspan><tspan fill="#cfcfd6">,</tspan></text>
    <text x="376" y="244"><tspan fill="#cfcfd6">};</tspan></text>
    <text x="376" y="272"><tspan fill="#82aaff">dev</tspan><tspan fill="#cfcfd6">.</tspan><tspan fill="#82aaff">ship</tspan><tspan fill="#cfcfd6">()</tspan></text>
    <text x="376" y="291" fill="#5c6370">// → shipped 🚀</text>
  </g>

