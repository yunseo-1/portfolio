  <text x="50" y="204" fill="#f4f4f7" font-size="33" font-weight="800">인터페이스를</text>
  <text x="50" y="243" fill="#f4f4f7" font-size="33" font-weight="800">설계합니다</text>
  <text x="52" y="278" fill="#9a9aa3" font-size="12">React · TypeScript 기반으로 제품을 만들고</text>
  <text x="52" y="297" fill="#9a9aa3" font-size="12">데이터로 검증하는 프론트엔드 개발자입니다.</text>
